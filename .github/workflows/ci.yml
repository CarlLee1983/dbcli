name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun-version: ['1.3.3', 'latest']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install

      - name: Required validation (bun run typecheck && bun test)
        run: |
          bun run build
          ls -l node_modules/.bin/dbcli || echo "dbcli not in node_modules/.bin"
          ./dist/cli.mjs --version
          bun run typecheck
          bun test
        env:
          SKIP_INTEGRATION_TESTS: 'true'

      - run: bun run lint
      - run: bun run dev -- --help
      - run: bun run dev -- --version

      - name: Verify executable (Unix/macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/cli.mjs --help
          ./dist/cli.mjs --version

      - name: Verify executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "dist/cli.mjs"
          if (-not (Test-Path $exePath)) {
            throw "Executable not found: $exePath"
          }
          & $exePath --help
          & $exePath --version

      - name: Run performance benchmarks
        run: bun run test:perf
        continue-on-error: true
