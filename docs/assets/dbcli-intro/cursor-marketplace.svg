<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">dbcli Cursor Marketplace cover</title>
  <desc id="desc">Square promotional image with a dark background plate, secure database nodes, a terminal window, and the dbcli wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="55%" stop-color="#0a1020"/>
      <stop offset="100%" stop-color="#070b12"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="36%" r="60%">
      <stop offset="0%" stop-color="#2ee7de" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#2ee7de" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2ee7de" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#172033"/>
      <stop offset="100%" stop-color="#090d14"/>
    </linearGradient>
    <linearGradient id="plateEdge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8bb6ff"/>
      <stop offset="55%" stop-color="#26487a"/>
      <stop offset="100%" stop-color="#1b2f55"/>
    </linearGradient>
    <linearGradient id="dbBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7e96b9"/>
      <stop offset="100%" stop-color="#36486a"/>
    </linearGradient>
    <linearGradient id="dbRim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b5c9ea"/>
      <stop offset="100%" stop-color="#6a81a5"/>
    </linearGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#9aeef2"/>
      <stop offset="100%" stop-color="#26d5c8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.55"/>
    </filter>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="0 0 0 0 0.16
                0 0 0 0 0.90
                0 0 0 0 0.88
                0 0 0 0.7 0" />
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="78" y="78" width="868" height="868" rx="88" fill="url(#plate)" stroke="url(#plateEdge)" stroke-width="12"/>
