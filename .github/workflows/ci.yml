name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun-version: ['1.3.3', 'latest']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install

      # Keep these as separate steps: PowerShell can otherwise let a later
      # successful native command mask an earlier non-zero exit code on Windows.
      - name: Build
        run: bun run build

      - name: Agent core purity
        run: bun run agent-core:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
        env:
          SKIP_INTEGRATION_TESTS: 'true'

      - run: bun run lint
      - run: bun run dev -- --help
      - run: bun run dev -- --version

      - name: Verify executable (Unix/macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/cli.mjs --help
          ./dist/cli.mjs --version

      - name: Verify executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "dist/cli.mjs"
          if (-not (Test-Path $exePath)) {
            throw "Executable not found: $exePath"
          }
          & $exePath --help
          & $exePath --version

      - name: Run performance benchmarks
        run: bun run test:perf
        continue-on-error: true

  docs-parity:
    # Drift guards: fail the build when the CLI, SKILL.md, reference.md, managed
    # platform copies, or user docs fall out of sync. Runs once (not per matrix).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Documentation & skill drift guards
        run: |
          bun run skill:check
          bun run platform:check
          bun run plugin:check
          bun run docs:check
          bun run contract:check
