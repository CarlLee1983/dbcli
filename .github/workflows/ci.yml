name: CI

on: [push, pull_request]

# Least privilege by default. No job here writes to the repository, publishes a
# package, or comments on a PR, so nothing needs more than read. A job that ever
# does gets its own `permissions:` block rather than raising this one.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # One slow runner must not cancel the others: a macOS failure used to
      # leave both Windows jobs "cancelled" with no result of their own.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        bun-version: ['1.3.3', 'latest']
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}
      - run: bun install --frozen-lockfile

      # Keep these as separate steps: PowerShell can otherwise let a later
      # successful native command mask an earlier non-zero exit code on Windows.
      - name: Build
        run: bun run build

      - name: Agent core purity
        run: bun run agent-core:check

      - name: Core writes no stdout
        run: bun run core-stdout:check

      - name: Typecheck
        run: bun run typecheck

      # Separate project because the test tree needs no declaration output and
      # the build reads `tsconfig.json` directly. Test files went untypechecked
      # for a long time — the main include used a brace glob TypeScript does not
      # expand — so losing this step would put them back there (#97).
      - name: Typecheck tests
        run: bun run typecheck:tests

      # Via `bun run` so the timeout lives in one place (package.json). Bun's 5s
      # default is too tight for windows-latest, where spawning a process costs
      # seconds; `[test] timeout` in bunfig.toml is documented but not honoured by
      # Bun 1.3.x, so the flag has to ride on the command.
      - name: Test
        run: bun run test
        env:
          SKIP_INTEGRATION_TESTS: 'true'

      - run: bun run lint
      - run: bun run dev -- --help
      - run: bun run dev -- --version

      - name: Verify executable (Unix/macOS/Linux)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ./dist/cli.mjs --help
          ./dist/cli.mjs --version

      - name: Verify executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exePath = "dist/cli.mjs"
          if (-not (Test-Path $exePath)) {
            throw "Executable not found: $exePath"
          }
          & $exePath --help
          & $exePath --version

      # Blocking. It was `continue-on-error: true`, and two blacklist benchmarks
      # then failed unnoticed for four months (2026-03-26 → 2026-08-06) while the
      # masking path ran 6x over budget. Every budget here is now set from a real
      # runner measurement rather than a dev machine, and each one prints what it
      # measured, so a tightening margin is visible before it turns the build red.
      - name: Run performance benchmarks
        run: bun run test:perf

  format:
    # Formatting is platform-independent, so this runs once rather than per matrix
    # entry. It exists because `release:check` was the only thing enforcing prettier:
    # four unformatted files reached main through green CI and were caught minutes
    # before a release. Scope is now the whole repo minus `.prettierignore`, which
    # is where the reasoning lives: build outputs, test fixtures, managed copies and
    # documentation are excluded on purpose — Markdown tables are contract-tested by
    # `tests/unit/skill-assets/*`, and prettier re-pads every table it touches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Prettier
        run: bun run format:check

  build-determinism:
    # A bundler free to decide differently on the next run ships a different
    # product than the one that was tested (#56). Builds twice, compares hashes.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build is reproducible
        run: bun run build:determinism

  integration:
    # The matrix job runs with SKIP_INTEGRATION_TESTS=true, so until this
    # existed `tests/integration` was compiled and skipped in CI — 600-odd
    # assertions against MySQL, PostgreSQL, Redis, MongoDB and Elasticsearch
    # that only ever ran on a developer's machine, reporting the same green
    # either way. Once, on Linux, where docker is available on the runner.
    #
    # REQUIRE_INTEGRATION_SERVICES turns the suite's auto-skip into a failure:
    # a job that starts no services must go red rather than quietly pass, which
    # is the whole reason this job is worth its minutes.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - name: Start test databases
        run: docker compose -f docker-compose.test.yml up -d --wait

      # Before the suite rather than after: one readable failure naming the
      # address beats 600 tests skipping past an unreachable service.
      - name: Services are reachable
        run: bun run services:check

      # This is the repository-owned ForgeFlow gate. The focused jobs above and
      # below remain in place for platform-specific and fast failure signals.
      - name: Canonical verification
        run: make verify

      - name: Service logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.test.yml logs --tail 100

      - name: Stop test databases
        if: always()
        run: docker compose -f docker-compose.test.yml down -v

  docs-parity:
    # Drift guards: fail the build when the CLI, SKILL.md, reference.md, managed
    # platform copies, or user docs fall out of sync. Runs once (not per matrix).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Documentation & skill drift guards
        run: |
          bun run skill:check
          bun run platform:check
          bun run plugin:check
          bun run manifest:check
          bun run docs:check
          bun run contract:check
          bun run plan:check

  audit:
    # Dependency advisories were only ever seen by whoever ran `release:check`
    # by hand, which is one person shortly before a release. Blocking, and on
    # every push: an advisory that lands mid-cycle should turn the branch red
    # while the change that pulled it in is still on screen, not weeks later.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Dependency audit
        run: bun audit
