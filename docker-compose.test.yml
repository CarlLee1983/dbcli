# Integration test databases
# Usage: docker compose -f docker-compose.test.yml up -d
# Ports offset to avoid conflicts with local databases (3307/5433)

services:
  mysql:
    image: mysql:8.4
    ports:
      - '3307:3306'
    environment:
      MYSQL_ROOT_PASSWORD: testpass
      MYSQL_DATABASE: dbcli_test
      MYSQL_USER: dbcli
      MYSQL_PASSWORD: testpass
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost', '-u', 'root', '-ptestpass']
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/mysql

  # MariaDB is not MySQL for the purposes of these tests: the error codes,
  # `ANALYZE SELECT`, and the EXPLAIN output shape differ, which is exactly what
  # tests/integration/p{1,2,3}-*.test.ts exercise. They had no service to run
  # against and skipped everywhere, including locally.
  mariadb:
    image: mariadb:11
    ports:
      - '3308:3306'
    environment:
      MARIADB_ROOT_PASSWORD: testpass
      MARIADB_DATABASE: dbcli_test
      MARIADB_USER: dbcli
      MARIADB_PASSWORD: testpass
    healthcheck:
      test: ['CMD', 'healthcheck.sh', '--connect', '--innodb_initialized']
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/mysql

  postgres:
    image: postgres:16-alpine
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: dbcli_test
      POSTGRES_USER: dbcli
      POSTGRES_PASSWORD: testpass
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dbcli -d dbcli_test']
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data

  # Port is the MongoDB default rather than an offset one: the existing mongo
  # integration tests already default to mongodb://localhost:27017, and giving
  # the service a different port would leave them silently skipping.
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping")']
      interval: 3s
      timeout: 5s
      retries: 10
    tmpfs:
      - /data/db

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    ports:
      - '9201:9200'
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "curl -s http://localhost:9200/_cluster/health | grep -q '\"status\":\"green\"\\|\"status\":\"yellow\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
